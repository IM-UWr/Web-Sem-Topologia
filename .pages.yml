# Pages CMS — Web-Sem-Topologia: Seminarium: Topologia.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
# Zlecenie 40: opis seminarium i streszczenie referatu zaraz pod tytułem, pola EN pod polskimi, ściągawka przy Treści, szablon streszczenia, ukryta notatka redakcyjna.
# Zlecenie 48: przełącznik „Opublikowane” w opisie seminarium i w referatach, zaraz pod tytułem (odznaczone = szkic, widoczny tylko na Podglądzie; seminarium-szkic ukrywa też swoje referaty).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: seminarium
  label: 'Seminarium: Topologia (opis)'
  description: "Opis seminarium: prowadzący, kontakt, archiwum. Widać go na stronie seminarium w Nauce → Seminaria."
  type: file
  path: src/content/seminaria/topologia.md
  format: yaml-frontmatter
  fields:
  - name: nazwa
    label: Nazwa seminarium
    type: string
    required: true
  - name: nazwa_en
    label: 'EN: nazwa'
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować seminarium bez pokazywania go na stronie publicznej (szkic). Razem z nim znikną wszystkie jego referaty.
    type: boolean
    default: true
  - name: body
    label: Opis (Markdown, wzory w $...$)
    description: "Zwykły Markdown: akapity oddziela pusta linia; **pogrubienie**, *kursywa*, [tekst linku](https://…); lista: „- ” na początku linii; ## = nagłówek sekcji. Plik PDF: wgraj w „Media” i wklej link. Komentarze <!-- … --> to podpowiedzi; na stronie ich nie widać. Wzory w $…$."
    type: code
    options:
      format: markdown
  - name: tresc_en
    label: 'EN: opis (Markdown; puste = wersja angielska pokaże opis po polsku)'
    type: code
    options:
      format: markdown
  - name: haslo
    label: Hasło (podtytuł na liście seminariów)
    type: string
  - name: haslo_en
    label: 'EN: hasło (podtytuł na liście seminariów)'
    type: string
  - name: prowadzacy
    label: Koordynator (imię i nazwisko jak w spisie pracowników; tytuł doda się sam)
    description: Termin i salę wpisuje się przy każdym referacie osobno.
    type: string
    list: true
  - name: kontakt
    label: E-mail kontaktowy (pod nazwiskiem koordynatora)
    type: string
  - name: archiwum
    label: Link do archiwum referatów (np. dawna strona seminarium; pokazuje się pod minionymi referatami)
    type: string
  - name: zaklad
    label: Zakład (puste = seminarium niezależne)
    description: Każdy zakład ma jedno seminarium. Seminarium niezwiązane z zakładem zostaw bez zakładu — pokaże się w grupie „Seminaria niezależne”. (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
    type: select
    options:
      values:
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
  - name: aktywne
    label: Aktywne
    type: boolean
    default: true
  - name: do_uzupelnienia
    label: Do uzupełnienia (notatka redakcyjna, niewyświetlana)
    type: string
    list: true
    hidden: true
- name: referaty
  label: Referaty
  description: Każde seminarium ma swój folder — dodaj referat w folderze właściwego seminarium. Termin i salę wpisuje się przy każdym referacie.
  type: collection
  path: src/content/referaty/topologia
  format: yaml-frontmatter
  subfolders: true
  filename:
    template: '{year}-{month}-{day}-{primary}.md'
  view:
    fields:
    - tytul
    - prelegent
    - termin
    primary: tytul
    sort: [termin]
    default:
      sort: termin
      order: desc
  fields:
  - name: tytul
    label: Tytuł referatu
    type: string
    required: true
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować referat bez pokazywania go na stronie publicznej (szkic).
    type: boolean
    default: true
  - name: jezyk
    label: Język referatu
    description: Gdy polski, na stronie angielskiej po tytule pojawi się „(talk in Polish)”. Tytułu się nie tłumaczy.
    type: select
    options:
      values:
      - name: pl
        label: polski
      - name: en
        label: angielski
  - name: prelegent
    label: Prelegent
    type: string
    required: true
  - name: afiliacja
    label: Afiliacja
    type: string
  - name: afiliacja_en
    label: 'EN: afiliacja (puste = wersja angielska pokaże afiliację po polsku)'
    type: string
  - name: termin
    label: Termin
    type: date
    required: true
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm
  - name: sala
    label: Sala
    type: string
  - name: sala_en
    label: 'EN: sala (opis miejsca po angielsku, gdy to nie numer sali; puste = wersja angielska pokaże salę po polsku)'
    type: string
  - name: body
    label: Streszczenie (Markdown, wzory w $...$)
    description: "Zwykły Markdown: akapity oddziela pusta linia; **pogrubienie**, *kursywa*, [tekst linku](https://…); lista: „- ” na początku linii; ## = nagłówek sekcji. Plik PDF: wgraj w „Media” i wklej link. Komentarze <!-- … --> to podpowiedzi; na stronie ich nie widać. Wzory w $…$. Pusta Treść (albo sam komentarz) = referat bez streszczenia."
    type: code
    options:
      format: markdown
    default: "<!-- STRESZCZENIE: Zwykły tekst; wzory w $…$. Slajdy: dodaj w „Pliki” niżej. -->"
  - name: tresc_en
    label: 'EN: streszczenie (Markdown, wzory w $...$; puste = wersja angielska pokaże streszczenie z pola wyżej)'
    type: code
    options:
      format: markdown
  - name: pliki
    label: Pliki (slajdy itp.)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{nazwa}"
    fields:
    - name: nazwa
      label: Nazwa
      type: string
    - name: plik
      label: Plik
      description: Wymagane. Jeśli nie chcesz pliku, usuń tę pozycję ikoną kosza.
      type: file
      required: true
      options:
        path: public/pliki/seminaria
    - name: pozycja
      type: boolean
      hidden: true
