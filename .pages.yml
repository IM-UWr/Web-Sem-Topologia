# Pages CMS — Web-Sem-Topologia: Seminarium: Topologia.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: seminarium
  label: 'Seminarium: Topologia (opis)'
  type: file
  path: src/content/seminaria/topologia.md
  format: yaml-frontmatter
  fields:
  - name: nazwa
    label: Nazwa seminarium
    type: string
    required: true
  - name: nazwa_en
    label: 'EN: nazwa'
    type: string
  - name: prowadzacy
    label: Koordynator (imię i nazwisko jak w spisie pracowników; tytuł doda się sam)
    description: Termin i salę wpisuje się przy każdym referacie osobno.
    type: string
    list: true
  - name: kontakt
    label: E-mail kontaktowy (pod nazwiskiem koordynatora)
    type: string
  - name: archiwum
    label: Link do archiwum referatów (np. dawna strona seminarium; pokazuje się pod minionymi referatami)
    type: string
  - name: zaklad
    label: Zakład (puste = seminarium niezależne)
    description: Każdy zakład ma jedno seminarium. Seminarium niezwiązane z zakładem zostaw bez zakładu — pokaże się w grupie „Seminaria niezależne”. (lista z innego
      repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
    type: select
    options:
      values:
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
  - name: aktywne
    label: Aktywne
    type: boolean
    default: true
  - name: do_uzupelnienia
    label: Do uzupełnienia (notatka redakcyjna, niewyświetlana)
    type: string
    list: true
  - name: body
    label: Opis (Markdown, wzory w $...$)
    type: code
    options:
      format: markdown
  - name: tresc_en
    label: 'EN: opis (Markdown; puste = wersja angielska pokaże opis po polsku)'
    type: text
- name: referaty
  label: Referaty
  description: Każde seminarium ma swój folder — dodaj referat w folderze właściwego seminarium. Termin i salę wpisuje się przy każdym referacie.
  type: collection
  path: src/content/referaty/topologia
  format: yaml-frontmatter
  subfolders: true
  filename:
    template: '{year}-{month}-{day}-{primary}.md'
    field: create
  view:
    fields:
    - tytul
    - prelegent
    - termin
    primary: tytul
    sort: termin
    order: desc
  fields:
  - name: tytul
    label: Tytuł referatu
    type: string
    required: true
  - name: prelegent
    label: Prelegent
    type: string
    required: true
  - name: afiliacja
    label: Afiliacja
    type: string
  - name: termin
    label: Termin
    type: date
    required: true
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm
  - name: sala
    label: Sala
    type: string
  - name: pliki
    label: Pliki (slajdy itp.)
    type: object
    list: true
    fields:
    - name: nazwa
      label: Nazwa
      type: string
    - name: plik
      label: Plik
      type: file
      options:
        path: public/pliki/seminaria
  - name: body
    label: Streszczenie (Markdown, wzory w $...$)
    type: code
    options:
      format: markdown
